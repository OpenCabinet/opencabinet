# Checks the application crates: formatting, lints, tests on Linux and
# Windows, and the licenses and sources of every dependency.

name: Rust

on:
  pull_request:
    paths:
      - crates/**
      - fixtures/**
      - assets/**
      - Cargo.toml
      - Cargo.lock
      - clippy.toml
      - deny.toml
      - rust-toolchain.toml
      - .github/workflows/rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Every warning is an error in CI.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads rust-toolchain.toml and installs the pinned version.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # The libraries Slint links against on Linux: fonts, keyboard layouts,
      # Wayland and X11, and OpenGL.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dri mesa-vulkan-drivers
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
        env:
          # The 3D view is drawn on the processor (lavapipe, WARP); without
          # an adapter its test fails rather than skips.
          OPENCABINET_REQUIRE_3D: "1"
      # Pictures of the sample kitchen in 3D, to look at.
      - name: Keep the 3D pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: view3d-${{ matrix.os }}
          path: target/view3d/
          if-no-files-found: ignore
      - name: Documentation
        run: cargo doc --locked --workspace --no-deps
      # The cut list PDF, read back by independent open source readers.
      - name: Check the PDF with independent readers
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -q -p opencabinet-reports --example cut_list_pdf -- cut-list.pdf
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils
          qpdf --check cut-list.pdf
          text=$(pdftotext cut-list.pdf -)
          for expected in "Cut list" "Left side" "Door 2" "28-19/32" "4 edges" "Materials" "Drawer slides"; do
            grep -qF "$expected" <<< "$text" || { echo "missing: $expected"; exit 1; }
          done
          pdffonts cut-list.pdf
          # The elevations: a page per wall, each with its title and scale.
          cargo run --locked -q -p opencabinet-reports --example elevations -- elevations
          qpdf --check elevations/elevations.pdf
          text=$(pdftotext elevations/elevations.pdf -)
          for expected in "Elevation — Kitchen - North" "Elevation — Kitchen - East" "Scale 1/2\" = 1'-0\"" "Page 2 of 2" "B30"; do
            grep -qF "$expected" <<< "$text" || { echo "missing: $expected"; exit 1; }
          done
          # OpenCabinet Review's markups (RFC-0004): the sheets as written,
          # one incremental update after them, and one annotation per kind
          # of markup, as an independent reader sees them.
          count=$(cargo run --locked -q -p opencabinet-review --example marked_pdf -- marked.pdf flat.pdf)
          qpdf --check marked.pdf
          test "$(grep -ac '%%EOF' marked.pdf)" -eq 2
          # qpdf's JSON lists the objects as they are after the update; the
          # first page's /Annots, an array or a reference to one, holds them.
          qpdf --json=2 --json-key=pages --json-key=qpdf marked.pdf > marked.json
          annotations=$(python3 - <<'PY'
          import json
          data = json.load(open("marked.json"))
          objects = data["qpdf"][1]
          def value(ref):
              return objects["obj:" + ref]["value"]
          annots = value(data["pages"][0]["object"]).get("/Annots", [])
          if isinstance(annots, str):
              annots = value(annots)
          print(len(annots))
          PY
          )
          test "$annotations" -eq "$count" || { echo "expected $count annotations, found $annotations"; exit 1; }
          # The flattened copy: valid, with the markups drawn into the
          # page and none left as annotations.
          qpdf --check flat.pdf
          qpdf --json=2 --json-key=pages --json-key=qpdf flat.pdf > flat.json
          left=$(python3 - <<'PY'
          import json
          data = json.load(open("flat.json"))
          page = data["qpdf"][1]["obj:" + data["pages"][0]["object"]]["value"]
          print(len(page.get("/Annots", [])))
          PY
          )
          test "$left" -eq 0 || { echo "expected no annotations, found $left"; exit 1; }
      # The parts as DXF, audited by ezdxf (ADR-0015).
      - name: Check the DXF files with ezdxf
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -q -p opencabinet-reports --example parts_dxf -- parts-dxf
          python3 -m venv "$RUNNER_TEMP/ezdxf"
          "$RUNNER_TEMP/ezdxf/bin/pip" install --quiet ezdxf==1.4.5
          "$RUNNER_TEMP/ezdxf/bin/python" -I scripts/check-dxf.py parts-dxf
          cargo run --locked -q -p opencabinet-reports --example elevations -- elevations-dxf
          "$RUNNER_TEMP/ezdxf/bin/python" -I scripts/check-dxf.py elevations-dxf WALL

  dependencies:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A released binary, verified against its published checksum.
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/$name.tar.gz"
          echo "$DENY_SHA256  deny.tar.gz" | sha256sum --check
          tar -xzf deny.tar.gz
          mv "$name/cargo-deny" "$HOME/.cargo/bin/"
      - name: Check licenses, sources and advisories
        run: cargo deny --locked check
