[package]
name = "opencabinet-review-app"
description = "OpenCabinet Review, the desktop application for marking up PDF drawings"
# Review is its own program with its own releases (RFC-0004 §1).
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "opencabinet-review"
path = "src/main.rs"

[dependencies]
opencabinet-model = { workspace = true }
opencabinet-pdf = { workspace = true }
opencabinet-review = { workspace = true }
opencabinet-session = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rfd = "0.17.2"
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
i-slint-backend-testing = "1.18.1"
opencabinet-pdf = { workspace = true }

[lints]
workspace = true
