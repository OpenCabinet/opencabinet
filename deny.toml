# cargo-deny checks every third-party crate before it enters the program:
# its license must be compatible with GPL-3.0-or-later (plan, section A),
# it must come from crates.io, and it must have no known vulnerability.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported, not fatal: a replacement needs a plan.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # chrono was declared unmaintained in November 2026. It comes through the
  # `dxf` crate (ADR-0015) and Slint, not our own code, and has no
  # replacement until they move to jiff or time. Approved by Andrés on
  # 2026-11-19; remove this once neither depends on chrono.
  { id = "RUSTSEC-2026-0543", reason = "chrono, through dxf and Slint; no replacement yet" },
]

[licenses]
# Every license here is compatible with GPL-3.0-or-later. Adding one needs
# a pull request that explains why it is compatible.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # Slint, the interface toolkit (ADR-0012), is GPL-3.0-only or proprietary;
  # OpenCabinet uses it under the GPL (ADR-0013).
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9
# OpenCabinet's own crates are GPL-3.0-or-later and never published.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates refer to each other by path, which counts as a wildcard.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
